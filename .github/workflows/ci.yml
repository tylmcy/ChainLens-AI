name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 完整验证：普通测试 + Testcontainers PostgreSQL；GitHub Hosted Runner 自带 Docker。
  # 冒烟测试（@Tag smoke：真实 LLM / 联网模型下载）默认排除，
  # 手动运行：mvn verify -Dsurefire.excludedGroups=none
  unit-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify (smoke excluded, DB via Testcontainers)
        run: mvn -B -ntp verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
