spring:
  application:
    name: chainlens
  ai:
    # M3 默认走确定性分析与模板报告；M5 接入 LLM 后通过环境变量显式启用提供商。
    # 无 API Key 时应用仍必须可启动并返回确定性结果。
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    deepseek:
      # 把项目统一的环境变量显式映射到 Spring AI 2.0 要求的厂商配置。
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          # 报告生成低随机性（设计文档 4.4）；业务代码不 import 厂商类，仅参数化配置
          temperature: 0.2
          model: ${DEEPSEEK_MODEL:deepseek-flash}
    mcp:
      server:
        enabled: true
        name: chainlens-ai
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: >-
          ChainLens 只读地分析 Ethereum 交易和受控知识库；交易事实来自 JSON-RPC，
          风险结论来自确定性规则，不提供签名、广播或任何写链能力。
        annotation-scanner:
          enabled: true
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chainlens}
    username: ${POSTGRES_USER:chainlens}
    password: ${POSTGRES_PASSWORD:chainlens}
  sql:
    init:
      # V1 单表 schema 直接由 schema.sql 初始化（M4 的 docker compose 提供数据库）
      mode: always
  threads:
    virtual:
      enabled: true

chainlens:
  eth:
    rpc-url: ${ETH_RPC_URL:http://127.0.0.1:8545}
    chain-id: ${ETH_CHAIN_ID:31337}
  concurrency:
    max: ${CHAINLENS_CONCURRENCY_MAX:4}
  mcp:
    # 留空时只依靠默认回环地址；如果容器对外暴露，建议配置 Bearer Token。
    token: ${CHAINLENS_MCP_TOKEN:}
    transport: streamable-http

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
